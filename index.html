<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Virtual Farm Competition — CSU-TAPS</title>
<meta name="robots" content="noindex, nofollow, noarchive" />
<meta name="description" content="Manage one acre of Colorado corn. Set hybrid, seeding rate, nitrogen and irrigation, then see your yield, nitrogen and water use efficiency, and your farm budget." />
<style>
/* Calibri throughout. Carlito is the metric-compatible fallback on Linux and
   most Android devices; the rest is a standard system fallback chain. */
:root{
  --canvas:#FFFFFF;--surface:#FFFFFF;--surf2:#F4F4F4;
  --green:#1E4D2B;--green-dk:#143620;--green-lt:#EDF3EE;
  --ink:#000000;--mute:#5A5A5A;--line:#D6D6D6;
  --red:#B00020;
  --font:Calibri,Carlito,"Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--canvas);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body{min-height:100vh;padding:16px 16px 44px}
button,input{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:6px}
.wrap{max-width:1060px;margin:0 auto}
.narrow{max-width:600px;margin:0 auto}
.mono{font-family:var(--font)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.pad{padding:16px}
.stack{display:flex;flex-direction:column;gap:14px}
.between{display:flex;align-items:center;justify-content:space-between}
.row{display:flex;align-items:center;gap:10px}
.eyebrow{font-family:var(--font);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--green);font-weight:700}
.eyebrow.m{color:var(--mute);font-weight:400}
.small{font-family:var(--font);font-size:12.5px;color:var(--mute);line-height:1.65}
.link{font-family:var(--font);font-size:13.5px;color:var(--mute);display:inline-flex;align-items:center;gap:5px}
.link:hover{color:var(--green)}
h1.hero{font-weight:700;letter-spacing:-.02em;font-size:clamp(28px,6.6vw,44px);line-height:1.08;color:var(--green);white-space:nowrap}
h2.sc{font-weight:800;letter-spacing:-.025em;font-size:clamp(24px,5.6vw,31px);line-height:1.1;margin:5px 0 6px;color:var(--green)}
.lede{color:var(--mute);font-size:16px;line-height:1.55;max-width:56ch}
.topbar{display:flex;align-items:center;justify-content:flex-end;margin-bottom:14px}
.topbar .link{font-size:13.5px;color:var(--green);font-weight:600}
.hero-logo{height:78px;width:auto;display:block;margin-bottom:18px;max-width:100%}
.band .ttl{color:#FFFFFF;font-family:var(--font);font-size:15px;font-weight:700;letter-spacing:.02em;line-height:1.2}
.band .link{color:#FFFFFF;font-size:13px;flex:0 0 auto}
.band .link:hover{color:#fff}
/* footnote — the "what is this" box under each decision */
.fn{background:var(--green-lt);border:1px solid #D6D6D6;border-left:3px solid var(--green);border-radius:10px;padding:12px 14px}
.fn b{display:block;font-size:13.5px;color:var(--green);margin-bottom:4px;font-weight:700}
.fn span{font-size:13.5px;color:#000000;line-height:1.6}
.band{background:var(--green);border-radius:14px;padding:12px 16px;display:flex;
  align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.band .lg{display:flex;align-items:center;gap:12px;min-width:0}
.band .logo{height:42px;width:auto;display:block;border-radius:6px;background:#FFFFFF;padding:5px 8px;flex:0 0 auto}
.band .badge{background:#FFFFFF;color:var(--green);border-radius:5px;padding:3px 9px;font-weight:800;font-size:13px}
.band .ttl{color:#FFFFFF;font-family:var(--font);font-size:15.5px;font-weight:700;line-height:1.2}
.band .link{color:#FFFFFF;font-size:13px;flex:0 0 auto}
.band .link:hover{color:var(--green-lt)}
/* one row per month: name, rain, applied, total, with the slider beneath */
.wtab{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.wtab .hd,.wtab .mr{display:grid;grid-template-columns:1fr 3.2rem 3.2rem 3.4rem;
  gap:6px;align-items:center;padding:7px 11px}
.wtab .hd{background:var(--surf2);border-bottom:1px solid var(--line)}
.wtab .hd span{font-family:var(--font);font-size:12px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--mute);text-align:right}
.wtab .hd span:first-child{text-align:left}
.wtab .mr{border-top:1px solid var(--line)}
.wtab .mr:first-of-type{border-top:none}
.wtab .mr b{font-weight:700;font-size:14px}
.wtab .mr i{font-style:normal;font-family:var(--font);font-size:14px;text-align:right;color:var(--mute)}
.wtab .mr i.ap{color:var(--ink);font-weight:700}
.wtab .mr i.tt{color:var(--green);font-weight:700}
.wtab .sl{padding:0 11px 11px}
.wtab .sl input[type=range]{width:100%}
.wtab .tot{display:grid;grid-template-columns:1fr 3.2rem 3.2rem 3.4rem;gap:6px;align-items:center;
  padding:10px 11px;background:var(--green-lt);border-top:1px solid var(--green)}
.wtab .tot b{font-weight:700;font-size:14px;color:var(--green)}
.wtab .tot i{font-style:normal;font-family:var(--font);font-size:15px;font-weight:700;
  text-align:right;color:var(--green)}
/* month-by-month water table: label, minus, slider, plus, value */
.wtab-head{display:grid;grid-template-columns:1fr auto;font-family:var(--font);font-size:12px;
  letter-spacing:.06em;text-transform:uppercase;color:var(--mute);
  padding-bottom:7px;border-bottom:1px solid var(--line);margin-bottom:4px}
.wtab-head span:last-child{text-align:right}
.wrow{display:grid;grid-template-columns:44px 34px 1fr 34px 74px;gap:9px;align-items:center;
  padding:9px 0;border-bottom:1px solid var(--line)}
.wrow:last-of-type{border-bottom:none}
.wmo{font-family:var(--font);font-size:16px;font-weight:700}
.wrow .slider{margin:0;width:100%}
.wval{text-align:right;white-space:nowrap}
.wnum{font-family:var(--font);font-size:25px;font-weight:700;font-variant-numeric:tabular-nums;
  color:var(--ink);line-height:1}
.wunit{font-family:var(--font);font-size:12px;color:var(--mute);margin-left:3px;font-weight:400}
.wtab-sum{display:grid;grid-template-columns:1fr auto;align-items:center;
  margin-top:10px;padding-top:10px;border-top:2px solid var(--green)}
.wtab-sum .wnum{color:var(--green)}
/* progress */
.prog{display:flex;gap:5px;margin-bottom:16px}
.prog i{flex:1;height:4px;border-radius:99px;background:var(--line)}
.prog i.on{background:var(--green)}
.prog i.done{background:var(--green)}
/* buttons */
.btn{display:block;width:100%;border-radius:11px;padding:14px 20px;font-weight:700;font-size:16.5px;background:var(--green);color:#fff;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.btn.gold{background:var(--green);color:#FFFFFF}
.btn.ghost{background:var(--surface);border:1px solid var(--line);color:var(--green)}
.btn.danger{background:var(--surface);border:1px solid var(--red);color:var(--red);font-size:15.5px}
.nav{display:flex;gap:10px}
.nav .btn{flex:1}
.nav .btn.back{flex:0 0 30%}
.field{width:100%;margin-top:7px;border-radius:11px;padding:13px 15px;background:var(--surface);border:1px solid var(--line);font-family:var(--font);font-size:17.5px}
.field::placeholder{color:#5A5A5A}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border-radius:999px;padding:8px 15px;font-family:var(--font);font-size:13.5px;border:1px solid var(--line);color:var(--mute);background:var(--surface)}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}
/* dial */
.dhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.dname{font-family:var(--font);font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.dval{font-family:var(--font);font-size:25px;font-weight:700}
.dunit{font-family:var(--font);font-size:12px;color:var(--mute);margin-left:4px}
.step{flex:0 0 auto;border-radius:9px;padding:8px;background:var(--surf2);border:1px solid var(--line);display:flex}
.step:active{transform:scale(.9)}
input[type=range]{flex:1;height:26px;background:transparent;-webkit-appearance:none;appearance:none}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:99px;background:var(--surf2);border:1px solid var(--line)}
input[type=range]::-moz-range-track{height:6px;border-radius:99px;background:var(--surf2);border:1px solid var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;margin-top:-11px;background:var(--c,var(--green));border:3px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.25)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--c,var(--green));border:3px solid #fff}
.bar{height:4px;border-radius:99px;background:var(--surf2);overflow:hidden;margin-top:9px}
.bar>i{display:block;height:100%;border-radius:99px;opacity:.75}
/* hybrid cards */
.hgrid{display:grid;grid-template-columns:1fr;gap:8px}
.hcard{border-radius:11px;padding:11px 12px;background:var(--surface);border:1px solid var(--line);
  text-align:left;display:flex;align-items:center;gap:8px}
.hcard.on{background:var(--green-lt);border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}
.hcard .hleft{flex:1 1 auto;min-width:0}
.hcard .co{font-family:var(--font);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);display:block}
.hcard .nm{font-weight:700;font-size:15.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hcard .hmid{flex:0 0 auto;width:58px;text-align:center;
  border-left:1px solid var(--line);border-right:1px solid var(--line);padding:2px 0}
.hcard.on .hmid{border-color:#D6D6D6}
.hcard .crmv{font-family:var(--font);font-size:16.5px;font-weight:700;color:var(--green);display:block;line-height:1.1}
.hcard .cap{font-family:var(--font);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);display:block}
.hcard .hright{flex:0 0 auto;width:62px;text-align:right}
.hcard .price{font-family:var(--font);font-size:16.5px;font-weight:700;color:var(--green);display:block;line-height:1.1}
/* months */
.mrow{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:none}
.mrow .mo{font-family:var(--font);font-size:13px;width:34px;flex:0 0 auto;text-transform:uppercase;letter-spacing:.08em;color:var(--mute)}
.mrow .amt{font-family:var(--font);font-size:15.5px;font-weight:700;width:48px;text-align:right;flex:0 0 auto;color:var(--ink)}
.mrow .tgt{font-family:var(--font);font-size:12px;color:var(--mute);width:44px;text-align:right;flex:0 0 auto}
.tot{display:flex;align-items:baseline;gap:7px}
.tot b{font-family:var(--font);font-size:29px;font-weight:700;color:var(--ink)}
/* nitrogen bank */
.bank{height:26px;border-radius:7px;overflow:hidden;display:flex;border:1px solid var(--line);background:var(--surf2)}
.bank i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:9px}
.legend span{font-family:var(--font);font-size:12.5px;color:var(--mute);display:flex;align-items:center;gap:5px}
.legend em{width:9px;height:9px;border-radius:2px;display:inline-block;font-style:normal}
/* table */
.tbl{width:100%;border-collapse:collapse;font-family:var(--font);font-size:13.5px}
.tbl td{padding:7px 0;border-bottom:1px solid var(--line)}
.tbl td:last-child{text-align:right}
.tbl td:first-child{color:var(--mute)}
.tbl tr:last-child td{border-bottom:none}
.tbl tr.sum td{border-top:2px solid var(--green);padding-top:9px;font-weight:700;color:var(--green)}
/* metrics */
.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.metrics .panel{padding:12px}
.mk{font-family:var(--font);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);display:flex;align-items:center;gap:6px}
.award{height:22px;width:auto;display:block;flex:0 0 auto}
.awardbig{height:52px;width:auto;display:block;margin:0 auto 8px}
.mv{font-family:var(--font);font-size:21px;font-weight:700;margin-top:3px}
.mu{font-family:var(--font);font-size:12px;color:var(--mute)}
/* the cob fills from the bottom as the yield climbs */
.cob-wrap{position:relative;width:190px;max-width:56vw;margin:0 auto;
  display:flex;flex-direction:column;align-items:center}
.cob-stack{position:relative;width:100%;aspect-ratio:261/420}
.cob-img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
/* The window grows upward but the picture inside never moves: the inner layer
   is pinned to the full height of the stack, so the trophy simply turns from
   pale to gold from the base up. */
.cob-fill{overflow:hidden;position:absolute;left:0;right:0;bottom:0;height:0;
  transition:height 1.9s cubic-bezier(.25,.8,.35,1)}
.cob-inner{position:absolute;left:0;bottom:0;width:100%}
.cob-inner .cob-img{position:static;width:100%;height:100%;display:block;object-fit:contain}
.cob-read{text-align:center;margin-top:10px}
.cob-read .y{font-family:var(--font);font-weight:700;font-size:clamp(34px,12vw,48px);
  color:var(--green);line-height:1}
.cob-read .u{font-family:var(--font);font-size:12px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--mute);margin-top:4px}
.cob-scale{font-family:var(--font);font-size:12px;color:var(--mute);margin-top:6px}
.pivot-hold{position:relative;width:242px;height:242px;max-width:72vw;max-height:72vw;margin:0 auto}
.pivot-hold svg{width:100%;height:100%;display:block}
.readout{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.readout .y{font-family:var(--font);font-weight:700;font-size:clamp(31px,11vw,44px);color:var(--green);line-height:1}
.readout .u{font-family:var(--font);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin-top:4px}
.tag{font-family:var(--font);font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:99px;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.tag.ml{border-color:var(--green);color:var(--green);background:#FFFFFF}
/* ── a real cube, tumbled with CSS 3D transforms ─────────────────────────── */
.die-stage{width:170px;height:170px;perspective:900px;perspective-origin:50% 45%;
  display:flex;align-items:center;justify-content:center;background:none;border:none;
  padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.cube{position:relative;width:104px;height:104px;transform-style:preserve-3d;
  transform:rotateX(-24deg) rotateY(32deg);transition:transform .9s cubic-bezier(.3,1.4,.5,1)}
.die-stage:active .cube{transform:rotateX(-24deg) rotateY(32deg) scale(.93)}
.cube.tumbling{animation:tumble 1.5s cubic-bezier(.28,.62,.32,1) forwards}
@keyframes tumble{
  0%   {transform:translateY(-70px) rotateX(-24deg) rotateY(32deg) rotateZ(0deg) scale(.8)}
  25%  {transform:translateY(10px)  rotateX(280deg) rotateY(200deg) rotateZ(120deg) scale(1)}
  45%  {transform:translateY(-34px) rotateX(560deg) rotateY(420deg) rotateZ(240deg)}
  65%  {transform:translateY(6px)   rotateX(760deg) rotateY(610deg) rotateZ(330deg)}
  82%  {transform:translateY(-12px) rotateX(880deg) rotateY(700deg) rotateZ(370deg)}
  93%  {transform:translateY(2px)   rotateX(930deg) rotateY(740deg) rotateZ(388deg)}
  100% {transform:translateY(0)     rotateX(940deg) rotateY(752deg) rotateZ(392deg)}
}
.face{position:absolute;width:104px;height:104px;border-radius:14px;
  background:linear-gradient(150deg,#2C6B3E 0%,#1E4D2B 55%,#163A21 100%);
  border:2px solid #10281A;box-sizing:border-box;padding:11px;
  display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
  backface-visibility:hidden}
.face i{width:17px;height:17px;border-radius:50%;background:#FFFFFF;
  align-self:center;justify-self:center;
  box-shadow:inset 0 -2px 3px rgba(0,0,0,.28)}
.f1{transform:translateZ(52px)}
.f6{transform:rotateY(180deg) translateZ(52px)}
.f2{transform:rotateY(90deg)  translateZ(52px)}
.f5{transform:rotateY(-90deg) translateZ(52px)}
.f3{transform:rotateX(90deg)  translateZ(52px)}
.f4{transform:rotateX(-90deg) translateZ(52px)}
.face-flat{width:88px;height:88px;border-radius:14px;margin:0 auto 4px;
  background:linear-gradient(150deg,#2C6B3E 0%,#1E4D2B 55%,#163A21 100%);
  border:2px solid #10281A;box-sizing:border-box;padding:10px;
  display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
  box-shadow:0 5px 10px rgba(0,0,0,.2)}
.face-flat i{width:15px;height:15px;border-radius:50%;background:#FFFFFF;
  align-self:center;justify-self:center;box-shadow:inset 0 -2px 3px rgba(0,0,0,.28)}
.die-shadow{width:96px;height:14px;border-radius:50%;background:rgba(0,0,0,.18);
  filter:blur(5px);margin:-14px auto 0;transition:transform .3s}
.rolled{text-align:center}
.rolled .num{font-family:var(--font);font-size:47px;font-weight:700;color:var(--green);line-height:1}
.rolled .lbl{font-family:var(--font);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-top:5px}
.rolled .band-tag{display:inline-block;margin-top:9px;font-family:var(--font);font-size:12.5px;
  padding:3px 11px;border-radius:99px;background:var(--green-lt);border:1px solid var(--green);color:var(--green)}
.dice-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;padding:8px 0}
/* board */
.tabs{display:flex;gap:6px}
.tabs button{flex:1;border-radius:10px;padding:9px 4px;font-family:var(--font);font-size:13px;border:1px solid var(--line);color:var(--mute);background:var(--surface)}
.tabs button.on{background:var(--green);border-color:var(--green);color:#fff}
.lb{display:flex;align-items:flex-start;gap:12px;padding:13px 10px;border-bottom:1px solid var(--line)}
.lb:last-child{border-bottom:none}
.lb.me{background:var(--green-lt);border-radius:8px;box-shadow:inset 0 0 0 1px var(--green)}
.lb .r{font-family:var(--font);font-size:15.5px;font-weight:800;width:30px;flex:0 0 auto;color:var(--mute);text-align:center}
.lb .r.medal{width:30px;height:30px;line-height:30px;border-radius:50%;color:#fff;font-size:14px}
.lb .who{flex:1;min-width:0}
.lb .who b{font-weight:700;font-size:16.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb .sub{font-family:var(--font);font-size:13.5px;color:var(--mute);display:block;margin-top:3px;line-height:1.35}
.lb .v{text-align:right;flex:0 0 auto}
.lb .v b{font-family:var(--font);font-size:19px;font-weight:700;color:var(--green);display:block;line-height:1.1}
.lb .v span{font-family:var(--font);font-size:12.5px;color:var(--mute);text-transform:lowercase}
.lbhead{display:flex;align-items:center;gap:12px;padding:6px 10px 8px}
.lbhead .r{width:30px;flex:0 0 auto}
.lbhead .who{flex:1}
.lbhead span{font-family:var(--font);font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.empty{text-align:center;padding:38px 12px;font-family:var(--font);font-size:13.5px;color:var(--mute);line-height:1.7}
/* modal */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(20,40,26,.55);display:flex;align-items:center;justify-content:center;padding:18px}
.sheet{width:100%;max-width:560px;max-height:86vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.sheet p{font-size:14px;color:#000000;line-height:1.7;margin-bottom:11px}
@media (min-width:880px){
  body{padding:24px 24px 60px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
  .hgrid{grid-template-columns:1fr 1fr}
  .metrics{grid-template-columns:repeat(4,1fr)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="band" id="band">
    <span class="lg">
      <img class="logo" id="brandLogo" src="logo.png" alt="CSU-TAPS"
           onerror="this.style.display='none';document.getElementById('brandFallback').style.display='inline-block'">
      <span class="badge" id="brandFallback" style="display:none">CSU-TAPS</span>
      <span class="ttl">Virtual Farm Competition</span></span>
    <button class="link" id="aboutBtn">How it works</button>

const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;
  for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c>>>0;}return t;})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function enc(s){return new TextEncoder().encode(s);}
function zip(files){
  const parts=[],dir=[];let off=0;
  const dt=new Date(),dosT=((dt.getHours()<<11)|(dt.getMinutes()<<5)|(dt.getSeconds()/2))&0xFFFF;
  const dosD=(((dt.getFullYear()-1980)<<9)|((dt.getMonth()+1)<<5)|dt.getDate())&0xFFFF;
  for(const f of files){
    const name=enc(f.name),data=enc(f.data),c=crc32(data);
    const h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0,true);
    h.setUint16(8,0,true);h.setUint16(10,dosT,true);h.setUint16(12,dosD,true);
    h.setUint32(14,c,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);
    h.setUint16(26,name.length,true);h.setUint16(28,0,true);
    parts.push(new Uint8Array(h.buffer),name,data);
    const d=new DataView(new ArrayBuffer(46));
    d.setUint32(0,0x02014b50,true);d.setUint16(4,20,true);d.setUint16(6,20,true);
    d.setUint16(8,0,true);d.setUint16(10,0,true);d.setUint16(12,dosT,true);d.setUint16(14,dosD,true);
    d.setUint32(16,c,true);d.setUint32(20,data.length,true);d.setUint32(24,data.length,true);
    d.setUint16(28,name.length,true);d.setUint16(30,0,true);d.setUint16(32,0,true);
    d.setUint16(34,0,true);d.setUint16(36,0,true);d.setUint32(38,0,true);d.setUint32(42,off,true);
    dir.push(new Uint8Array(d.buffer),name);
    off+=30+name.length+data.length;
  }
  let dLen=0;for(const p of dir)dLen+=p.length;
  const e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);
  e.setUint32(12,dLen,true);e.setUint32(16,off,true);e.setUint16(20,0,true);
  const all=parts.concat(dir,[new Uint8Array(e.buffer)]);
  let n=0;for(const p of all)n+=p.length;

}
function xesc(v){return String(v).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));}
function sheetXml(rows){
  const body=rows.map((r,ri)=>'<row r="'+(ri+1)+'">'+r.map((c,ci)=>{
    const ref=String.fromCharCode(65+(ci%26))+(ci>=26?'':'')+(ri+1);
    const col=(ci<26?String.fromCharCode(65+ci):String.fromCharCode(64+Math.floor(ci/26))+String.fromCharCode(65+(ci%26)))+(ri+1);
    if(c===null||c===undefined||c==='')return '';
    return (typeof c==='number'&&isFinite(c))
      ? '<c r="'+col+'"><v>'+c+'</v></c>'
      : '<c r="'+col+'" t="inlineStr"><is><t xml:space="preserve">'+xesc(c)+'</t></is></c>';
  }).join('')+'</row>').join('');
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
  '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>'+body+'</sheetData></worksheet>';
}
function buildXlsx(sheets){ // sheets = [{name, rows:[[...]]}]
  const files=[
    {name:'[Content_Types].xml',data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'+
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'+
      '<Default Extension="xml" ContentType="application/xml"/>'+
      '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'+
      sheets.map((s,i)=>'<Override PartName="/xl/worksheets/sheet'+(i+1)+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join('')+
      '</Types>'},
    {name:'_rels/.rels',data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'},
    {name:'xl/workbook.xml',data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'+
      sheets.map((s,i)=>'<sheet name="'+xesc(s.name)+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>').join('')+
      '</sheets></workbook>'},
    {name:'xl/_rels/workbook.xml.rels',data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
      sheets.map((s,i)=>'<Relationship Id="rId'+(i+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>').join('')+
      '</Relationships>'}
  ];
  sheets.forEach((s,i)=>files.push({name:'xl/worksheets/sheet'+(i+1)+'.xml',data:sheetXml(s.rows)}));
  return zip(files);
}

/* ═══════════════════════════════════════════════════════════════════════════
   VIRTUAL FARM COMPETITION — Colorado State University
   CSU AI Team · TAPS precision corn production

   YIELD = model attainable  ×  nitrogen  ×  over-watering
     · attainable  — XGBoost, 200 trees, trained on 153 TAPS plot-years
                     (2024 + 2025). Responds to irrigation, seeding rate, CRM,
                     soil nitrate and season.
     · nitrogen    — soil nitrate + recovered fertiliser vs crop demand
     · over-watering — past the top of the irrigation training range

   ═══════════════════════════════════════════════════════════════════════════ */

/* ── The die ────────────────────────────────────────────────────────────────
   Six faces spanning 65 to 120 lb/ac of residual soil nitrate, weighted toward
   the 80 to 120 range: five of the six faces sit in that band.

   The 2024 CSU-TAPS report notes that pre-plant soil N in the competition field
   was variable, and that participants were not charged for nitrogen up to a
   combined 160 lb/ac counting soil plus applied. A roll in this range therefore
   leaves real work for the fertiliser decision, which is the point of the game.
   ─────────────────────────────────────────────────────────────────────────── */
const SOIL_FACES = [
  { face:1, n:65  },
  { face:2, n:80  },
  { face:3, n:90  },
  { face:4, n:100 },
  { face:5, n:110 },
  { face:6, n:120 },
];
/* returns {face, n} - the face that landed and the nitrate it stands for */
function rollDie(){
  return SOIL_FACES[Math.floor(Math.random()*6)];
}
const SOIL = { min:65, max:120 };

const SEASON_YEAR = 2024;  // a normal Colorado season. 2025 was drought-hit

const N_REF = 110;
/* TAPS plots ranged from 4.1 to 19.3 in. Past that the trees have no data
   and simply repeat their last leaf value, which drifts upward and would reward
   a participant for over-watering. The model input is capped at the top of the
   training range: extra water still costs money and still drags WUE down, it
   just cannot buy yield the data never showed. */
/* CSU-TAPS puts the gross seasonal requirement for a full crop at about 16 in.
   Past that, extra water leaches nitrogen below the roots and buys nothing, so
   the yield is trimmed. 19.3 in is where the training data stops. */
const IRR_FULL_CROP = 16.0;
const IRR_MODEL_MAX = 19.3;   // lb/ac, dataset median applied N, held fixed in the model call

/* ── nitrogen ───────────────────────────────────────────────────────────── */
/* CSU-TAPS fertigates at V8, VT/R1, R2 and R3, so four passes whenever any
   fertigation is applied. Participants do not choose the number. */
const FERT_PASSES = 4;
/* ── Nitrogen: CSU Extension Fact Sheet 0.538 ───────────────────────────────
   "Fertilizing Corn", Davis & Westfall, revised 2014. CSU's published
   algorithm, adopted from the University of Nebraska:

     N rate = 35 + 1.2 x expected yield
                 - 8 x ppm NO3-N in the top 2 ft
                 - 0.14 x expected yield x %organic matter
                 - other credits

   A 2-ft acre slice weighs about 8 million lb, so 8 lb/ac per ppm is simply
   the soil nitrate expressed in lb/ac. The dice already gives lb/ac, so the
   nitrate credit is subtracted directly.

   Turned into a yield response: the algorithm gives the nitrogen a crop needs,
   and yield is scaled by how much of that need was met.

   Validated against the 2024 award winners. CSU would have told Farm 18, the
   most profitable, to apply 77 lb/ac; they applied 83. Farm 12, the most input
   use efficient, 64 lb/ac; they applied 60. Farm 3 chased the yield award with
   182 lb/ac where the algorithm called for 91.
   ─────────────────────────────────────────────────────────────────────────── */
const CSU_N = {
  base:        35,     // lb/ac, the algorithm's intercept
  perBushel:   1.2,    // lb N per bu of expected yield
  omCredit:    0.14,   // lb N credited per bu per % organic matter
  organicPct:  1.5,    // CSU's stated default for eastern Colorado soils
  recovBase:   0.52,   // share of applied N the crop recovers, one application
  recovPerApp: 0.040,  // each extra split adds this much
  recovMax:    0.78,
  curve:       3.0,    // Mitscherlich curvature on the sufficiency ratio
  luxuryFrom:  1.35,   // past this, uptake exceeds what becomes grain
  luxuryRate:  0.06,
};
function nRecovery(events){
  return Math.min(CSU_N.recovMax, CSU_N.recovBase + CSU_N.recovPerApp*Math.max(0, events));
}
/* the nitrogen CSU says this crop needs from the bag, given its soil */
function csuRequirement(soilN, attainable){
  return Math.max(0, CSU_N.base + CSU_N.perBushel*attainable
                     - soilN
                     - CSU_N.omCredit*attainable*CSU_N.organicPct);
}

function nitrogenFactor(soilN, applied, events, attainable){
  const rec = nRecovery(events);
  const fromBag = applied*rec;
  const need = csuRequirement(soilN, attainable);          // what CSU says to buy
  const demand = CSU_N.base + CSU_N.perBushel*attainable
                 - CSU_N.omCredit*attainable*CSU_N.organicPct;   // total crop need
  const avail = soilN + fromBag;
  const ratio = demand > 0 ? avail/demand : 1;
  const K = CSU_N.curve, norm = 1 - Math.exp(-K);
  let f = Math.min(1, (1 - Math.exp(-K*ratio))/norm);
  if (ratio > CSU_N.luxuryFrom)
    f = Math.max(0.80, f - CSU_N.luxuryRate*(ratio - CSU_N.luxuryFrom));
  return { f, avail, demand, ratio, rec, fromBag, need };
}

const YIELD_FULL = 240;

/* ── CSU TAPS 2026 Farm Budget, April prices ────────────────────────────── */
/* ── Seed price ─────────────────────────────────────────────────────────────
   Per-hybrid, $ per 80,000-seed bag, from the 2024 and 2025 TAPS entry records.
   Ships inside model_js.json alongside company and CRM. Prices ran $264 to $358
   in 2025 — a $94 spread, which on 33,000 seeds/ac is about $39 an acre.
   ─────────────────────────────────────────────────────────────────────────── */
const bagPrice = name => {
  const h = MODEL.hybrids.find(x => x.name === name);
  return h && h.bag ? h.bag : 300;
};

const BUDGET = {
  /* field operations — operational + ownership, $/ac */
  landPrep:        75.50,
  herbicideApp1:    7.00,
  herbicideApp2:    7.00,
  preplantFertApp:  8.00,   // only if pre-plant N applied
  preplantIncorp:  14.00,   // only if pre-plant N applied
  planting:        22.00,
  sidedressApp:    10.00,   // only if side-dress applied
  fertigationApp:   1.15,   // per fertigation event
  irrigationEvent:  1.15,   // per irrigation event
  pivotOwnership:  19.24,
  combineHarvest:  34.85,
  grainCartOwn:     8.40,
  grainCartPerBu:   0.0205,
  /* materials & services */
  herbicides:     102.16,
  seedPerBag:     250.00,   // 80,000-seed bag
  seedsPerBag:     80000,
  optiStart:       18.25,   // 2.5 gal/ac at $7.30
  preplantMix:     63.06,   // 30 lb N + 60 lb P package
  preplantMixN:       30,   // lb N in that package
  nPerLb:           0.74,   // side-dress and fertigation N
  waterPerIn:       6.70,   // includes water and electricity
  haulPerBu:        0.20,   // $200 per 1,000 bu inside 20 miles
  scouting:        13.00,
  technology:      10.00,
  cropInsurance:   10.00,
  /* finance and overhead */
  interestRate:    0.065,
  interestMonths:      6,
  overhead:        12.42,
  cashRent:       180.00,
  /* the participant's irrigation is converted to events at this depth */
  inPerEvent:   1.20,
};
/* ownership (capital) share of each field operation, $/ac. Interest is charged
   only on cash expenses, so these are subtracted from the interest base — this
   is exactly how the TAPS sheet computes it. */
const OWNERSHIP = {
  "Land preparation": 11.677333, "Post Herbicide Application #1": 3.48,
  "Post Herbicide Application #2 (if needed)": 3.48, "Preplant Fertilizer Application": 3.98,
  "Preplant Fertilizer incorporation": 14.00, "Planting": 7.60375,
  "Sidedress N application": 4.971429, "Pivot Ownership Costs": 19.24,
  "Combine harvest": 16.851123, "Grain Cart": 8.40,
};

/* Line names below are taken verbatim from the CSU TAPS 2026 Farm Budget
   (April prices) so this table can be read row-against-row with the source. */
/* the four fertigation timings CSU-TAPS uses */
const FERT_TIMINGS = ["V8", "VT/R1", "R2", "R3"];

function farmBudget(st, yieldBu, totalIrr, appliedSide, appliedFert){
  const B = BUDGET;
  const irrEvents = Math.max(0, Math.round(totalIrr/B.inPerEvent));
  const prePlantOn = st.nPre > 0;
  const timings = FERT_TIMINGS;
  const fertEach = appliedFert>0 ? appliedFert/timings.length : 0;

  const ops = {
    "Land preparation":                     B.landPrep,
    "Post Herbicide Application #1":        B.herbicideApp1,
    "Post Herbicide Application #2 (if needed)": B.herbicideApp2,
    "Preplant Fertilizer Application":      prePlantOn ? B.preplantFertApp : 0,
    "Preplant Fertilizer incorporation":    prePlantOn ? B.preplantIncorp : 0,
    "Planting":                             B.planting,
    "Sidedress N application":              appliedSide>0 ? B.sidedressApp : 0,
  };
  for (const t of timings) ops["Fertigation N at "+t] = appliedFert>0 ? B.fertigationApp : 0;
  ops["Irrigation ("+irrEvents+" events)"] = irrEvents*B.irrigationEvent;
  ops["Pivot Ownership Costs"]             = B.pivotOwnership;
  ops["Combine harvest"]                   = B.combineHarvest;
  ops["Grain Cart"]                        = yieldBu*B.grainCartPerBu + B.grainCartOwn;

  const mats = {
    "Herbicides":                                   B.herbicides,
    "Corn Hybrid seed":                             (st.pop/B.seedsPerBag)*bagPrice(st.hybrid),
    "OptiStart gold (6-20-5-2S-0.05Mn-0.1Zn)":      B.optiStart,
    "Preplant mix - 30 lbs/ac N, 60 lbs/ac P":      B.preplantMix*(st.nPre/B.preplantMixN),
    "Sidedress N":                                  appliedSide*B.nPerLb,
  };
  for (const t of timings) mats["Fertigation N at "+t] = fertEach*B.nPerLb;
  mats["Irrigation total, linear VRI"] = totalIrr*B.waterPerIn;
  mats["Grain Hauling"]                = yieldBu*B.haulPerBu;
  mats["Grain Drying"]                 = 0;      // grain assumed at 15.5% moisture
  mats["Scouting and imagry"]          = B.scouting;
  mats["Technology"]                   = B.technology;
  mats["Marketing service"]            = 0;      // "No" in the source budget
  mats["Crop Insurance"]               = B.cropInsurance;

  const sum = o => Object.values(o).reduce((a,b)=>a+b,0);
  const opsTotal = sum(ops), matsTotal = sum(mats);
  const subtotal = opsTotal + matsTotal;
  // Interest is charged on cash expenses only, so ownership (capital) costs are
  // subtracted from the base — this is how the source sheet computes it.
  let ownTotal = 0;
  for (const k in ops) if (ops[k] > 0 && OWNERSHIP[k]) ownTotal += OWNERSHIP[k];
  const cashBase = matsTotal + (opsTotal - ownTotal);
  const interest = cashBase * B.interestRate * (B.interestMonths/12);
  const total = subtotal + interest + B.overhead + B.cashRent;
  const nCost = Object.entries(mats)
    .filter(([k])=>/Preplant mix|Sidedress N|Fertigation N/.test(k))
    .reduce((a,[,v])=>a+v, 0);
  const waterCost = mats["Irrigation total, linear VRI"] || 0;
  const seedCost  = mats["Corn Hybrid seed"] || 0;

  return { ops, mats, opsTotal, matsTotal, subtotal, interest, cashBase, ownTotal,
           nCost, waterCost, seedCost,
           overhead:B.overhead, cashRent:B.cashRent, total, irrEvents, timings,
           perBushel: yieldBu>0 ? total/yieldBu : null };
}

/* ── XGBoost evaluator (exported from the CSU AI Team pipeline) ─────────── */
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
/* The trees have no data outside their training range and simply repeat their
   last leaf value out there, which drifts upward and would reward nonsense.
   Every input is held to the range the model actually saw. */
function rawPredict(soilN, totalIrr, pop, crm){
  const L = MODEL.limits;
  const x = [clamp(soilN, L.NO3[0], L.NO3[1]),
             N_REF,
             clamp(totalIrr, L.Total_Irr[0], L.Total_Irr[1]),
             clamp(pop, L.pop[0], L.pop[1]),
             clamp(crm, L.CRM[0], L.CRM[1])];
  let s = MODEL.base_score;
  for (const t of MODEL.trees){
    let i = 0;
    while (Array.isArray(t[i])){ const n = t[i]; i = (x[n[0]] < n[1]) ? n[2] : n[3]; }
    s += t[i];
  }
  return s;
}

/* Trees are piecewise constant. With only 153 observations the steps are wide
   and land on whatever population and irrigation values TAPS growers happened
   to pick, so a raw prediction jumps 55 bu between 28,000 and 30,000 seeds and
   sits dead flat either side. That is quantisation, not agronomy.

   So the prediction is averaged over a small neighbourhood of seeding rate and
   irrigation. This is ordinary kernel smoothing of a step function: it keeps
   the trend the model learned and removes the cliffs, without inventing any
   agronomy of its own. */
const SMOOTH_POP = 2000;   // seeds/ac, half-width
const SMOOTH_IRR = 1.0;    // in, half-width
function modelPredict(totalIrr, crm, soilN, pop){
  const L = MODEL.limits;
  // Clamp BEFORE smoothing. If we smoothed first, a request past the top of the
  // range would average a window sitting entirely on the ceiling and score
  // higher than the ceiling itself — so 60,000 seeds would beat 36,000.
  const p0 = clamp(pop, L.pop[0] + SMOOTH_POP, L.pop[1] - SMOOTH_POP);
  const t0 = clamp(totalIrr, L.Total_Irr[0] + SMOOTH_IRR, L.Total_Irr[1] - SMOOTH_IRR);
  let sum = 0, n = 0;
  for (const dp of [-SMOOTH_POP, -SMOOTH_POP/2, 0, SMOOTH_POP/2, SMOOTH_POP]){
    for (const di of [-SMOOTH_IRR, -SMOOTH_IRR/2, 0, SMOOTH_IRR/2, SMOOTH_IRR]){
      sum += rawPredict(soilN, t0 + di, p0 + dp, crm);
      n++;
    }
  }
  return sum / n;
}

/* ── Below the trained range ────────────────────────────────────────────────
   No TAPS plot ever received less than about 4 in, so the model has nothing to
   say about a drier crop and clamping alone would report a fully irrigated
   yield for zero water. Below the training minimum the prediction is scaled
   down toward a dryland floor: at zero applied water the crop lives on rainfall
   alone, which at this site is roughly 3 to 6 in between May and August.
   The floor is set so that zero irrigation lands near the yield the CSU-TAPS
   control farm actually made on its minimal water.
   ─────────────────────────────────────────────────────────────────────────── */
/* ── When the water goes on ─────────────────────────────────────────────────
   Fitted from the event-level irrigation dates in AR_model_2024/2025.xlsx,
   all 153 plots:

       yield = 39 + 14.4 x (VT+R1+R2 inches) + 5.2 x (all other inches)

   Water applied through the reproductive window, roughly late June to mid
   August, returned 14.4 bu per inch against 5.2 bu per inch at any other time.
   Both seasons agree independently (19.6 vs 3.5 in 2024, 11.5 vs 3.7 in 2025),
   and the 2025 report reached the same conclusion by a different route.

   The model itself only ever sees a season total, so this is applied on top of
   it: a plan is scored against how a typical TAPS grower spread their water,
   and rewarded or penalised for putting more or less of it in the window that
   matters. Normalised so an average allocation scores 1.00.
   ─────────────────────────────────────────────────────────────────────────── */
const REPRO_VALUE = 14.4, OTHER_VALUE = 5.2;   // bu per in, fitted
const REPRO_SHARE_TYPICAL = 0.46;              // what TAPS growers actually did
const TIMING_SPAN = 0.22;                      // caps the swing at +/- 22%
function timingFactor(byMonth, totalIrr){
  if (totalIrr <= 0) return 1;
  // July and August carry the reproductive window at this site
  const repro = (byMonth.jul||0) + (byMonth.aug||0);
  const share = repro / totalIrr;
  const value = share*REPRO_VALUE + (1-share)*OTHER_VALUE;
  const typical = REPRO_SHARE_TYPICAL*REPRO_VALUE + (1-REPRO_SHARE_TYPICAL)*OTHER_VALUE;
  const f = 1 + TIMING_SPAN * (value/typical - 1) / (REPRO_VALUE/typical - 1);
  return Math.max(1-TIMING_SPAN, Math.min(1+TIMING_SPAN, f));
}

const DRYLAND_FLOOR = 0.35;
function waterShortFactor(totalIrr){
  const lo = MODEL.limits.Total_Irr[0];
  if (totalIrr >= lo) return 1;
  return DRYLAND_FLOOR + (1 - DRYLAND_FLOOR) * (totalIrr / lo);
}

function evaluate(st){
  const totalIrr = MONTHS.reduce((a,m)=>a+(st.irr[m.key]||0), 0);
  const appliedN = st.nPre + st.nSide + st.nFert;
  const h = MODEL.hybrids.find(x=>x.name===st.hybrid) || MODEL.hybrids[0];

  const attainable = modelPredict(totalIrr, h.crm, st.soilN, st.pop);
  const events = (st.nPre>0?1:0) + (st.nSide>0?1:0) + (st.nFert>0?FERT_PASSES:0);
  const N  = nitrogenFactor(st.soilN, appliedN, events, attainable);
  // beyond the training range, extra water leaches nitrogen and waterlogs roots
  const wet = Math.max(0.70, 1 - 0.015*Math.max(0, totalIrr - IRR_FULL_CROP));
  const dry = waterShortFactor(totalIrr);   // below it, the crop runs on rain alone
  const tf  = timingFactor(st.irr, totalIrr);
  const yieldBu = Math.max(0, attainable*N.f*wet*dry*tf);
  // yield is settled above; only now do we price it out
  const cost = farmBudget(st, yieldBu, totalIrr, st.nSide, st.nFert);
  const revenue = yieldBu * CORN_PRICE;
  const profit = revenue - cost.total;

  return { totalIrr, appliedN, events, hybrid:h, attainable, N, wet, dry, tf,
           yieldBu, cost, revenue, profit,
           /* Partial Factor Productivity: bu of grain per lb of N applied. */
           pfp: appliedN>0 ? yieldBu/appliedN : null,
           /* Water Use Efficiency: bu of grain per in of irrigation applied. */
           wue: totalIrr>0 ? yieldBu/totalIrr : null };
}

/* ── The die, as a real CSS 3D cube ─────────────────────────────────────────
   Six faces on an actual cube, tumbled with 3D transforms. The rotation that
   ends the tumble is chosen so the face that was rolled finishes on top, which
   is why the numbers you see are the number you get.
   ─────────────────────────────────────────────────────────────────────────── */
const PIP_GRID = {           // which of the nine grid cells carry a pip
  1:[4], 2:[0,8], 3:[0,4,8], 4:[0,2,6,8], 5:[0,2,4,6,8], 6:[0,2,3,5,6,8],
};
function faceHTML(n, cls){
  const on = PIP_GRID[n];
  return `<div class="face ${cls}">` +
    Array.from({length:9},(_,i)=> on.includes(i) ? '<i></i>' : '<i style="visibility:hidden"></i>').join('') +
    `</div>`;
}
function cubeHTML(){
  return `<div class="cube" id="cube">
    ${faceHTML(1,'f1')}${faceHTML(2,'f2')}${faceHTML(3,'f3')}
    ${faceHTML(4,'f4')}${faceHTML(5,'f5')}${faceHTML(6,'f6')}
  </div>`;
}
/* Once the roll is over the cube is gone and only the face that landed is
   shown, flat on, the way you would read a die that has come to rest. */
function landedFace(n){
  const on = PIP_GRID[n]||PIP_GRID[1];
  return `<div class="face-flat">` +
    Array.from({length:9},(_,i)=> on.includes(i) ? '<i></i>' : '<i style="visibility:hidden"></i>').join('') +
    `</div>`;
}
/* the resting rotation that brings each face to the front */
const FACE_REST = {
  1:'rotateX(-18deg) rotateY(22deg)',
  2:'rotateX(-18deg) rotateY(-68deg)',
  3:'rotateX(-108deg) rotateY(22deg)',
  4:'rotateX(72deg) rotateY(22deg)',
  5:'rotateX(-18deg) rotateY(112deg)',
  6:'rotateX(-18deg) rotateY(202deg)',
};

function soilBand(n){
  if(n<=100) return ["Low", "A hungry field. You will have to buy most of what the crop needs."];
  if(n<=160) return ["Below average", "Some help from the soil, but there is a real gap to fill."];
  if(n<=230) return ["Average", "A typical TAPS field. Roughly half the crop's need is already there."];
  if(n<=300) return ["High", "A generous field. Go easy on the fertiliser or you will waste it."];
  return ["Very high", "Loaded with carryover nitrate. Extra fertiliser will mostly be money burned."];
}

/* ── The cob ────────────────────────────────────────────────────────────────
   A pale cob sits behind, the full-colour one is revealed from the bottom up
   in proportion to the yield. It is completely full at YIELD_FULL bu/ac.
   ─────────────────────────────────────────────────────────────────────────── */
function cobHTML(){
  return `<div class="cob-wrap">
    <div class="cob-stack">
      <img class="cob-img" src="${COB.faded}" alt="">
      <div class="cob-fill" id="cobFill">
        <div class="cob-inner" id="cobInner"><img class="cob-img" src="${COB.full}" alt=""></div>
      </div>
    </div>
    <div class="cob-read">
      <div class="y" id="yNum">0</div>
      <div class="u">bu / ac</div>
      <div class="cob-scale" id="cobScale">a full gold trophy is ${YIELD_FULL} bu/ac</div>
    </div></div>`;
}
function runCob(instant){
  const r=S.result;
  const fill=document.getElementById("cobFill");
  const inner=document.getElementById("cobInner");
  const stack=fill&&fill.parentElement;
  // pin the gold layer to the full height of the stack so it never shifts
  if(inner&&stack&&stack.offsetHeight) inner.style.height=stack.offsetHeight+"px";
  const num=document.getElementById("yNum");
  const rv=document.getElementById("reveal");
  if(!fill) return;
  const pct=Math.max(0,Math.min(1,r.yieldBu/YIELD_FULL));
  const reduced=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(instant||reduced){
    fill.style.transition="none";
    fill.style.height=(pct*100)+"%";
    if(num) num.textContent=r.yieldBu.toFixed(0);
    if(rv) rv.style.opacity=1;
    return;
  }
  // let the browser paint the empty state, then grow
  requestAnimationFrame(()=>{ fill.style.height=(pct*100)+"%"; });
  const dur=1900, t0=performance.now();
  (function tick(now){
    const p=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-p,3);
    if(num) num.textContent=(r.yieldBu*e).toFixed(0);
    if(p<1) requestAnimationFrame(tick); else if(rv) rv.style.opacity=1;
  })(performance.now());
}

function stamp(ts){
  const d=new Date(ts), now=new Date();
  const time=d.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
  const sameDay = d.toDateString()===now.toDateString();
  return sameDay ? time : d.toLocaleDateString([], {month:"short", day:"numeric"})+" "+time;
}

/* ── talking to the shared sheet ────────────────────────────────────────── */
function shareEnabled(){ return typeof SHARE_URL === "string" && SHARE_URL.length > 10; }

function pushRemote(entry){
  if (!shareEnabled()) return;
  // text/plain keeps this a "simple request", so the browser skips the CORS
  // preflight that Apps Script cannot answer
  fetch(SHARE_URL, { method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
                     body: JSON.stringify(entry) })
    .catch(()=>{ /* the local copy is already saved, so a failure loses nothing */ });
}

/* Apps Script answers through a redirect to script.googleusercontent.com and
   cold-starts on the first call of the day, so the first request can take a
   while. Be patient, and try a second time before giving up. */
const REMOTE_TIMEOUT = 15000;
const REMOTE_RETRIES = 1;

function pullRemote(force){
  if (!shareEnabled()){ S.remoteState = "off"; return; }
  // a manual refresh always goes through, even if a previous call is stuck
  if (S.remoteState === "loading" && !force) return;
  S.remoteState = "loading";
  S.remoteError = "";

  const attempt = (tries) => {
    const ctl = typeof AbortController !== "undefined" ? new AbortController() : null;
    const timer = setTimeout(()=>{ if (ctl) ctl.abort(); }, REMOTE_TIMEOUT);
    const finish = (state, rows, why) => {
      clearTimeout(timer);
      if (rows) S.remote = rows;
      S.remoteState = state;
      S.remoteError = why || "";
      if (S.view === "board") renderAsync();
    };
    fetch(SHARE_URL + "?all=1", ctl ? { method:"GET", signal: ctl.signal } : { method:"GET" })
      .then(r => {
        if (!r.ok) throw new Error("the sheet replied " + r.status);
        return r.text();
      })
      .then(txt => {
        let rows;
        try { rows = JSON.parse(txt); }
        catch(e){
          // a sign-in page or a script error comes back as HTML, not JSON
          throw new Error(/<html/i.test(txt)
            ? "got a web page instead of data, so the deployment is probably not set to Anyone"
            : "could not read the reply");
        }
        if (rows && rows.ok === false) throw new Error(rows.error || "the script reported an error");
        finish("ok", Array.isArray(rows) ? rows : []);
      })
      .catch(err => {
        const why = (err && err.name === "AbortError")
          ? "the sheet did not answer in " + (REMOTE_TIMEOUT/1000) + " seconds"
          : (err && err.message) || "could not reach the sheet";
        if (tries > 0) { setTimeout(()=>attempt(tries-1), 700); return; }
        finish("error", null, why);
      });
  };
  attempt(REMOTE_RETRIES);
}


function postScore(){
  const r=S.result,c=r.cost;
  const e={ id:Date.now()+"-"+Math.random().toString(36).slice(2,7),
    name:S.name.trim()||"Anonymous", group:S.group, soilN:S.soilN,
    hybrid:r.hybrid.name, company:r.hybrid.company, crm:r.hybrid.crm, pop:S.pop,
    phone:(S.phone||"").trim(), email:(S.email||"").trim(),
    nPre:S.nPre, nSide:S.nSide, nFert:S.nFert, nEvents:FERT_PASSES, n:r.appliedN,
    months:Object.assign({},S.irr), irr:r.totalIrr, irrEvents:c.irrEvents,
    nAvail:r.N.avail, nDemand:r.N.demand, nRatio:r.N.ratio, nRec:r.N.rec,
    attainable:r.attainable, fN:r.N.f, wet:r.wet, bag:r.hybrid.bag, yieldBu:r.yieldBu,
    pfp:r.pfp, wue:r.wue,
    cOps:c.opsTotal, cMats:c.matsTotal, cInt:c.interest, cOver:c.overhead,
    cRent:c.cashRent, cTotal:c.total, perBu:c.perBushel,
    revenue:r.revenue, profit:r.profit, ts:Date.now() };
  const all=readBoard(); all.push(e); writeBoard(all);
  pushRemote(e);
  S.rank=all.slice().sort((a,b)=>b.yieldBu-a.yieldBu).findIndex(x=>x.id===e.id)+1;
  S.lastId=e.id; S.saved=true; S.tab="yield"; render();
}

/* ── the dice ───────────────────────────────────────────────────────────── */
function rollDice(btn){
  if (btn.dataset.busy) return;              // ignore taps mid-roll
  btn.dataset.busy = "1";
  const cube = document.getElementById("cube");
  const pick = rollDie();                    // {face, n} - decided up front

  const finish = () => {
    delete btn.dataset.busy;
    S.soilN = pick.n;
    S.rolledFace = pick.face;
    render();
  };

  const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!cube || reduced){ finish(); return; }

  // tumble, then settle so the rolled face is the one looking at you
  cube.classList.add("tumbling");
  setTimeout(()=>{
    cube.classList.remove("tumbling");
    cube.style.transform = FACE_REST[pick.face];
    setTimeout(finish, 620);                 // let the settle animation play
  }, 1500);                                  // matches the tumble keyframes
}

/* Wipes every decision so the next person starts fresh. The leaderboard is
   untouched, only the current run is cleared. */
/* ── Surviving a refresh ────────────────────────────────────────────────────
   A visitor who reloads mid-round should not lose their decisions. The run is
   saved on every change and restored on load. It is cleared only when the crop
   is grown or they go back to the start, so a fresh player never inherits the
   previous one's plan.
   ─────────────────────────────────────────────────────────────────────────── */
const RUN_KEY = "csu:vfc:run";
const RUN_FIELDS = ["view","name","group","soilN","rolledFace","hybrid","pop",
                    "nPre","nSide","nFert","irr"];
function saveRun(){
  try{
    const o={}; RUN_FIELDS.forEach(k=>o[k]=S[k]);
    localStorage.setItem(RUN_KEY, JSON.stringify(o));
  }catch(e){}
}
function clearRun(){ try{ localStorage.removeItem(RUN_KEY); }catch(e){} }
function restoreRun(){
  try{
    const raw=localStorage.getItem(RUN_KEY);
    if(!raw) return false;
    const o=JSON.parse(raw);
    if(!o || typeof o!=="object") return false;
    RUN_FIELDS.forEach(k=>{ if(o[k]!==undefined && o[k]!==null) S[k]=o[k]; });
    // never come back onto the result screen: that run is finished
    if(S.view==="result"||S.view==="board") S.view="welcome";
    return true;
  }catch(e){ return false; }
}

function resetRun(){
  S.name=""; S.phone=""; S.email=""; S.group="Student";
  S.soilN=null;
  S.hybrid=MODEL.hybrids[Math.floor(MODEL.hybrids.length/2)].name;
  S.pop=30000; S.nPre=0; S.nSide=0; S.nFert=0;
  S.irr={may:0,jun:0,jul:0,aug:0,sep:0,oct:0};
  S.result=null; S.saved=false; S.rank=null; S.lastId=null; S.tab="yield"; S.rolledFace=null;
  clearRun();
}

/* ── render + events ────────────────────────────────────────────────────── */
function checkMode(){
  const h=(location.hash||"")+(location.search||"");
  if (/[#&?]admin\b/i.test(h)) S.adminView = true;
}
/* The green band carries the logo and title on every screen except the
   welcome page, where the logo already appears large above the heading. */
function paintHeader(){
  const band=document.getElementById("band");
  const plain=document.getElementById("topbarPlain");
  const onWelcome = S.view==="welcome";
  if(band)  band.style.display  = onWelcome ? "none" : "flex";
  if(plain) plain.style.display = onWelcome ? "flex" : "none";
}

/* Replacing view.innerHTML destroys whatever the user is touching. If that
   happens between pointerdown and pointerup the browser never fires a click,
   so a tab tap silently does nothing. Async redraws therefore wait for the
   finger to lift, and are skipped entirely when the content is unchanged. */
/* A background refresh must not rewrite the screen while someone is tapping it.
   Replacing the DOM under a finger swallows the click, which showed up as
   leaderboard tabs "not working right away". The guard covers the press itself
   and the short tail afterwards, because the click event fires a few
   milliseconds after the finger lifts. */
let pointerDown = false, pendingRender = false, lastTouch = 0;
const TAP_TAIL = 450;   // ms of quiet required before a background repaint
document.addEventListener("pointerdown", ()=>{ pointerDown = true; lastTouch = Date.now(); });
const releasePointer = () => {
  pointerDown = false; lastTouch = Date.now();
  if (pendingRender){ pendingRender = false; setTimeout(renderAsync, TAP_TAIL); }
};
document.addEventListener("pointerup", releasePointer);
document.addEventListener("pointercancel", releasePointer);

let lastPaint = "";
/* Called when data arrives on its own, rather than from a tap. */
function renderAsync(){
  if (pointerDown){ pendingRender = true; return; }
  const quiet = Date.now() - lastTouch;
  if (quiet < TAP_TAIL){ setTimeout(renderAsync, TAP_TAIL - quiet); return; }
  const next = screenHTML();
  if (next === lastPaint) return;      // nothing to show that is not already shown
  render();
}

function screenHTML(){
  const V={ welcome, soil:soilScreen, hybrid:hybridScreen, seed:seedScreen, nitrogen:nitrogenScreen,
            water:waterScreen, budget:budgetScreen, result:resultScreen, board:boardScreen };
  return (V[S.view]||welcome)();
}

function render(){
  const html=screenHTML();
  lastPaint=html;
  view.innerHTML=html;
  paintHeader();
  if(S.view!=="result"&&S.view!=="board") saveRun();
  if(S.view==="result") runCob(S.saved);
}
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="nameIn"){ S.name=t.value;
    const b=document.getElementById("startBtn");
    if(b){ if(S.name.trim()) b.removeAttribute("disabled"); else b.setAttribute("disabled",""); } }
  if(t.id==="phoneIn") S.phone=t.value;
  if(t.id==="emailIn") S.email=t.value;
  if(t.dataset&&t.dataset.slide) setInput(t.dataset.slide,parseFloat(t.value),true);
});
document.addEventListener("click",e=>{
  if(!e.target.closest) return;
  if((e.target.classList&&e.target.classList.contains("scrim"))||e.target.closest("button[data-close]")){ closeModal(); return; }
  const die=e.target.closest("[data-roll]");
  if(die){ rollDice(die); return; }
  const el=e.target.closest("[data-go],[data-group],[data-hyb],[data-bump],[data-tab],button");
  if(!el) return;
  if(el.dataset.group){ S.group=el.dataset.group; render(); return; }
  if(el.dataset.hyb){ S.hybrid=el.dataset.hyb; render(); return; }
  if(el.dataset.tab){ S.tab=el.dataset.tab; render(); return; }
  if(el.dataset.bump){ const k=el.dataset.bump; setInput(k,getV(k)+parseInt(el.dataset.dir,10)*LIMITS[k][2]); return; }
  if(el.id==="refreshBtn"){ pullRemote(true); render(); return; }
  if(el.dataset.go){
    const g=el.dataset.go;
    if(g==="result"){ openConfirm(); return; }        // ask before locking it in
    if(g==="welcome"){ resetRun(); }                  // a clean slate for the next person
    if(g==="board") pullRemote();
    if(g==="soil"&&(S.view==="result"||S.view==="board")){ S.saved=false; S.result=null; }
    go(g); return;
  }
  switch(el.id){
    case "confirmGrow":
      closeModal(); S.result=evaluate(S); S.saved=false; S.rank=null;
      clearRun();                       // the round is over; the next player starts clean
      go("result"); break;
    case "aboutBtn": case "aboutBtn2": openAbout(); break;
    case "postBtn": postScore(); break;
    case "xlBtn": exportMine(); break;
    case "allBtn": exportAll(); break;
    case "clearBtn":
      if(!S.confirmClear){ S.confirmClear=true; openAdmin(); }
      else { writeBoard([]); closeModal(); render(); }
      break;
  }
});
/* Five taps on the CSU-TAPS logo opens the booth controls. The logo only
   exists on the welcome screen, so this listens on the document instead of
   binding to an element that comes and goes. */
let taps=0,tt=null;
document.addEventListener("click",e=>{
  if(!e.target || e.target.id!=="mark") return;
  taps++; clearTimeout(tt); tt=setTimeout(()=>taps=0,1600);
  if(taps>=5){ taps=0; S.confirmClear=false; openAdmin(); }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeModal(); });
checkMode();
restoreRun();
if(S.adminView) pullRemote();
render();

</script>
